---
# Ansible Galaxy collection manifest for mcowser_p.declarative_access.
#
# `version` is a placeholder — semantic-release stamps the released version
# here at release time (see .releaserc.js) before building the collection
# artifact. Do not bump it by hand.
#
# Licensed under Apache-2.0 (see LICENSE) — accepted by public
# galaxy.ansible.com.
namespace: mcowser_p
name: declarative_access
version: 0.0.0
readme: README.md
authors:
  - mcowser-p
description: >-
  Declarative Linux access management — scoped sudoers grants for systemd
  services, timers, and podman quadlets; POSIX ACLs on files and folders;
  ownership enforcement; PAM group mapping; realm login; and lingering for
  rootless services. Profiles can be generated from install footprints by
  treadmark (`treadmark footprint --access-vars`).
license:
  - Apache-2.0
tags:
  - linux
  - windows
  - security
  - acl
  - sudoers
  - systemd
  - quadlet
  - iis
  - jea
  - infrastructure
dependencies:
  # Runtime deps of the declarative_access role. community.docker is
  # molecule-only and deliberately NOT a runtime dependency (requirements.yml
  # still installs it for development/CI).
  community.general: '>=6.0.0'
  ansible.posix: '>=1.5.0'
  microsoft.ad: '>=1.0.0'
  # Runtime dep of the declarative_access_windows role. The floor is 2.2.0:
  # that is the release where ansible.windows.win_acl gained certificate
  # private-key ACL support (Cert:\LocalMachine\<store>\<thumbprint> paths),
  # which the certkey primitive relies on. community.windows is not a
  # dependency - the Windows role grants on IIS objects, it never creates
  # them, so it needs nothing from that collection.
  ansible.windows: '>=2.2.0'
repository: https://github.com/mcowser-p/ansible-declarative-access
homepage: https://github.com/mcowser-p/ansible-declarative-access
issues: https://github.com/mcowser-p/ansible-declarative-access/issues
build_ignore:
  - .github
  - .claude
  - .git
  - .gitignore
  - .pre-commit-config.yaml
  - .releaserc.js
  - .ansible-lint
  - .yamllint
  - .editorconfig
  - scripts
  - package.json
  - package-lock.json
  - node_modules
  - requirements.txt
  - roles/declarative_access/molecule
  - roles/declarative_access/tests
  - '*.tar.gz'
