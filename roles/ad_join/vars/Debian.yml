---
ad_join_packages:
  - realmd
  - sssd
  - sssd-tools
  - libnss-sss
  - libpam-sss
  - adcli
  - samba-common-bin
  - oddjob
  - oddjob-mkhomedir
  - krb5-user
  # realmd shells out to PackageKit to install its own dependencies and fails
  # with "Necessary packages are not installed" without it. We also disable that
  # behaviour in realmd.conf, but the package still has to be present for
  # realmd to start cleanly.
  - packagekit
ad_join_pam_manager: pam-auth-update
