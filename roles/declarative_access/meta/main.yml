galaxy_info:
  namespace: mcowser_p
  role_name: declarative_access
  author: mcowser-p
  description: >-
    Declarative Linux access management - login, scoped sudo for systemd
    services/timers/quadlets, PAM group membership, file ACLs, ownership,
    and lingering for rootless services
  license: Apache-2.0
  min_ansible_version: '2.14'

  platforms:
    - name: EL
      versions:
        - '9'
        - '10'
    - name: Ubuntu
      versions:
        - 'noble'
        - 'resolute'
    - name: Amazon
      versions:
        - '2023'

  galaxy_tags:
    - acl
    - permissions
    - security
    - systemd
    - sudoers
    - quadlet

dependencies: []
