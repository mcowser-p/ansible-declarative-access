# verify.yml re-applies this profile with sudoers_state: absent and asserts
# the file is gone (the absent path can't live here — a present/absent pair
# in converge would break molecule's idempotence step).
- name: Test sudo profile used for the sudoers_state absent check
  hosts: all
  gather_facts: false
  tasks:
    - name: Apply declarative_access for the state-absent fixture profile
      ansible.builtin.include_role:
        name: declarative_access
      vars:
        declarative_access_group: test_group
        declarative_access_login: false
        declarative_access_sudo: true
        declarative_access_profile_name: "test-absent"
        declarative_access_services:
          - httpd

- name: Test pam_group with a custom (non-default) AD domain
  hosts: all
  gather_facts: false
  tasks:
    - name: Apply declarative_access with ad_domain example.org
      ansible.builtin.include_role:
        name: declarative_access
      vars:
        declarative_access_group: test_group
        declarative_access_login: false
        declarative_access_sudo: false
        declarative_access_pam_group: true
        declarative_access_ad_domain: "example.org"
        declarative_access_local_groups:
          - httpd

# Applied here like any profile; verify.yml revokes it through a REAL
# nested `ansible-playbook --tags cleanup` run (files/tagcleanup-playbook.yml)
# to prove the cleanup/never tag wiring end to end.
- name: Test combined profile for the --tags cleanup CLI test
  hosts: all
  gather_facts: false
  vars_files:
    - files/tagcleanup-access.yml
  tasks:
    - name: Apply the tagcleanup profile from its vars file
      ansible.builtin.include_role:
        name: declarative_access
      vars:
        declarative_access_group: test_group
        declarative_access_login: false
