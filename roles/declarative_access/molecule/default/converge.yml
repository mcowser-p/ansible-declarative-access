      vars:
        declarative_access_group: test_group
        declarative_access_login: false
        declarative_access_sudo: false
        declarative_access_folders_read:
          - /tmp/test_folder_read

- name: Test folders_modify permissions (group)
  hosts: all
  gather_facts: false
  tasks:
    - name: Apply declarative_access for folders_modify
      ansible.builtin.include_role:
        name: declarative_access
      vars:
        declarative_access_group: test_group
        declarative_access_login: false
        declarative_access_sudo: false
        declarative_access_folders_modify:
          - /tmp/test_folder_modify

- name: Test sudo with services and commands (group)
  hosts: all
  gather_facts: false
  tasks:
    - name: Apply declarative_access for sudo
      ansible.builtin.include_role:
        name: declarative_access
      vars:
        declarative_access_group: test_group
        declarative_access_login: false
        declarative_access_sudo: true
        declarative_access_profile_name: "test-app"
        declarative_access_services:
          - httpd
          - nginx
        declarative_access_commands:
          - /usr/bin/tail -f /var/log/messages
          - /usr/local/bin/deploy

- name: Test pam_group with local group mapping (group)
  hosts: all
  gather_facts: false
  tasks:
    - name: Apply declarative_access for pam_group
      ansible.builtin.include_role:
        name: declarative_access
      vars:
