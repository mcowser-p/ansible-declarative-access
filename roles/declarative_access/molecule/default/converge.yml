- name: Test ownership (chown/chmod)
  hosts: all
  gather_facts: false
  tasks:
    - name: Apply declarative_access for ownership
      ansible.builtin.include_role:
        name: declarative_access
      vars:
        declarative_access_group: test_group
        declarative_access_login: false
        declarative_access_sudo: false
        declarative_access_ownership:
          - path: /tmp/test_ownership_dir
            owner: ownership_user
            group: ownership_group
            mode: "0750"
            recurse: true
          - path: /tmp/test_ownership_file.txt
            owner: ownership_user
            group: ownership_group
            mode: "0640"

###########################################################################
# Behavioral pam_group — LOCAL principals (ad_domain "") mapped into a
# local group, proven over a real sshd by verify.yml. No AD anywhere.
###########################################################################

- name: Test pam_group behaviorally with a local user entity
  hosts: all
  gather_facts: false
  tasks:
    - name: Apply declarative_access mapping a local user via pam_group
      ansible.builtin.include_role:
        name: declarative_access
      vars:
        declarative_access_user: pam_ssh_user
        declarative_access_login: false
        declarative_access_sudo: false
        declarative_access_pam_group: true
        declarative_access_ad_domain: ""
        declarative_access_local_groups:
          - pamtest-group

- name: Test pam_group behaviorally with a local group entity
  hosts: all
  gather_facts: false
  tasks:
    - name: Apply declarative_access mapping a local group via pam_group
      ansible.builtin.include_role:
        name: declarative_access
      vars:
        declarative_access_group: sim-ad-group
        declarative_access_login: false
        declarative_access_sudo: false
        declarative_access_pam_group: true
        declarative_access_ad_domain: ""
        declarative_access_local_groups:
          - pamtest-group

