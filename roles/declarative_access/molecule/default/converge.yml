---
###########################################################################
# Test all five permission types using group-based access.
#
# The role treats user and group identically (just switches etype),
# so we only need to test one entity type thoroughly.
#
# Each invocation uses a separate declarative_access_profile_name to avoid
# sudoers file collisions, matching real-world usage.
#
# Verification (verify.yml) does the following:
#   1. getfacl checks — verify exact ACL strings on every target
#   2. su - test_user operations — prove ACLs work at the OS level
#      (test_user is a member of test_group, so group ACLs apply)
#   3. Sudo — comprehensive verification of all rendered sudoers commands
#   4. PAM group — verify group.conf entries and pam_group.so in sshd
#   5. Timers/quadlets — verify scoped unit grants (incl. absent actions)
#   6. cairn contract — apply files/molecule-access-vars.yml end to end
#   7. Cleanup — re-runs role with --tags cleanup, verifies removal
###########################################################################

- name: Test files_read permissions (group)
  hosts: all
  gather_facts: false
  tasks:
    - name: Apply declarative_access for files_read
      ansible.builtin.include_role:
        name: declarative_access
      vars:
        declarative_access_group: test_group
        declarative_access_login: false
        declarative_access_sudo: false
        declarative_access_files_read:
          - /tmp/test_file_read/readme.txt
          - /tmp/test_file_read/config/app.conf
          - /tmp/test_file_read/nested/deep/data.csv

- name: Test files_modify permissions (group)
  hosts: all
  gather_facts: false
  tasks:
