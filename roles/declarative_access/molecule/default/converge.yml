###########################################################################
# cairn contract — apply the committed vars-file fixture exactly the way
# playbooks/5_apply_access_profile.yml would (vars file + entity at apply
# time). Exercises services+timers+quadlets+unit-file write ACLs+folders+
# ownership+linger (linger tasks are tag-skipped in containers) in one run.
###########################################################################

- name: Test combined cairn-contract profile from vars file
  hosts: all
  gather_facts: false
  vars_files:
    - files/molecule-access-vars.yml
  tasks:
    - name: Apply declarative_access from the contract vars file
      ansible.builtin.include_role:
        name: declarative_access
      vars:
        declarative_access_group: test_group
        # The fixture carries linger: true (contract fidelity), but loginctl
        # needs systemd-logind, which these containers do not run — override
        # it off here. Tag-based skipping is not reliable under molecule
        # because it passes its own --skip-tags on the CLI.
        declarative_access_linger: false

