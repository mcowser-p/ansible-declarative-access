galaxy_info:
  namespace: mcowser_p
  role_name: declarative_access_windows
  author: mcowser-p
  description: >-
    Declarative Windows access management - IIS Manager delegation via WMSVC,
    feature delegation, NTFS DACLs with (OI)(CI) inheritance, certificate
    private-key grants, sc.exe sdset service control, JEA endpoints, local
    group membership, and ownership - with SDDL snapshots as the rollback
  license: Apache-2.0
  min_ansible_version: '2.14'

  platforms:
    - name: Windows
      versions:
        - '2022'
        - '2025'

  galaxy_tags:
    - windows
    - iis
    - acl
    - permissions
    - security
    - jea
    - sddl

dependencies: []
