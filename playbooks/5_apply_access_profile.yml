---
# Apply a declarative access profile from a vars file.
#
# The vars file is typically GENERATED by treadmark from an install footprint
# (`treadmark footprint ... --access-vars myapp-access.yml`) and describes WHAT
# was installed: services, timers, quadlet-generated units, unit files for
# write ACLs, folders, ownership, and rootless linger users. WHO gets the
# access is passed at apply time — never stored in the profile.
#
# Domain Group Naming Standard:
#   {hostname}-app_restricted  -> default group for application profiles
#
# SIMPLE USAGE (uses default app-restricted group):
# ansible-playbook -i inventory playbooks/5_apply_access_profile.yml \
#   -e @examples/myapp-access.yml
#
# USAGE WITH CUSTOM GROUP OR USER:
# ansible-playbook -i inventory playbooks/5_apply_access_profile.yml \
#   -e @myapp-access.yml -e "group_name=ps-webadmins" [-l ps-zzzapp-tst1]
# ansible-playbook -i inventory playbooks/5_apply_access_profile.yml \
#   -e @myapp-access.yml -e "user_name=someuser"
#
# OPTIONAL SITE TOGGLES (not part of the generated profile):
#   -e enable_login=true          also `realm permit` the entity on the host
#   -e enable_pam_group=true      also map the entity into local groups via
#                                 pam_group.so (requires
#                                 -e '{"declarative_access_local_groups": [...]}')
#
# CLEANUP (removes the sudoers file, group.conf entries, and lingering).
# Two keys by design, the tag selects and the var arms:
# ansible-playbook -i inventory playbooks/5_apply_access_profile.yml \
#   -e @myapp-access.yml [-e "group_name=..."] \
#   --tags cleanup -e declarative_access_force_cleanup=true
#
# REVIEW THE VARS FILE BEFORE APPLYING — it grants write ACLs on unit files,
# which is root-equivalent for those units when combined with sudo systemctl
# restart. See docs/declarative-systemd-access.md.

- name: Apply declarative access profile
  hosts: "{{ target_hosts | default('all') }}"
  gather_facts: true
  become: true

  tasks:
    # Entity resolution runs under `always` so `--tags cleanup` still knows
    # which sudoers file / group.conf entries to remove. Exactly one of
    # declarative_access_user / declarative_access_group ends up set — the
    # role asserts this.
    - name: Resolve entity - explicit group
      ansible.builtin.set_fact:
        declarative_access_group: "{{ group_name }}"
      when: group_name | default('') | length > 0
      tags:
        - always

    - name: Resolve entity - explicit user
      ansible.builtin.set_fact:
        declarative_access_user: "{{ user_name }}"
      when: user_name | default('') | length > 0
      tags:
        - always

    - name: Resolve entity - default to the host's app-restricted group
      ansible.builtin.set_fact:
        declarative_access_group: "{{ ansible_hostname | lower }}-app_restricted"
      when:
        - group_name | default('') | length == 0
        - user_name | default('') | length == 0
      tags:
        - always

    - name: Apply the access profile
      ansible.builtin.import_role:
        name: declarative_access
      vars:
        declarative_access_login: "{{ enable_login | default(false) | bool }}"
        declarative_access_pam_group: "{{ enable_pam_group | default(false) | bool }}"

    - name: Display access summary
      ansible.builtin.debug:
        msg:
          - "Access profile applied: {{ declarative_access_profile_name | default('(unnamed)') }}"
          - "  Entity: {{ declarative_access_group | default(declarative_access_user | default('?')) }}"
          - "  Services: {{ declarative_access_services | default([]) }}"
          - "  Timers: {{ declarative_access_timers | default([]) }}"
          - "  Quadlets (generated services): {{ declarative_access_quadlets | default([]) }}"
          - "  Linger users (rootless): {{ declarative_access_linger_users | default([]) }}"
          - "  Unit files writable: {{ declarative_access_files_modify | default([]) }}"
          - "  Folders modify/read: {{ declarative_access_folders_modify | default([]) }} / {{ declarative_access_folders_read | default([]) }}"
          - "  Ownership entries: {{ declarative_access_ownership | default([]) | length }}"
          - "To remove access: re-run with --tags cleanup -e declarative_access_force_cleanup=true"
