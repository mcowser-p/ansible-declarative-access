---
# Reviewed declarative-access profile for MySQL (EL9; EL10 ships MariaDB).
# Generated by `treadmark footprint --app mysql --access-vars`, then tightened at
# review — see docs/applications/mysql.md. Apply with:
#   ansible-playbook -i inventory playbooks/5_apply_access_profile.yml \
#     -e @examples/mysql-access.yml -e "group_name=<hostname>-app_restricted"
#
# Access model: CONFIG-SCOPED by default. Databases are administered through
# the SQL client (mysql -u root -p), not by touching raw data files — and the
# mysql group OWNS those raw files, so pam_group into it would over-grant.
# So this profile grants only config + logs via ACL, and NO pam_group.
#
# Group option (documented, not default): if you want the team in the mysql
# group (e.g. it already grants log read — /var/log/mysql is 0750 mysql), apply
# with -e enable_pam_group=true -e '{"declarative_access_local_groups":["mysql"]}'.
declarative_access_profile_name: 'mysql'
declarative_access_sudo: true
declarative_access_services:
  - 'mysqld'
  # Dropped from the raw profile: 'selinux-autorelabel' / '-mark' (OS units the
  # install scheduled — NOT mysql's) and '/etc/groff' (a transitive dependency).
declarative_access_folders_modify:
  - '/etc/my.cnf.d'   # config drop-ins — ACL write
declarative_access_folders_read:
  - '/var/log/mysql'  # error log — ACL read
# Data dirs: enforce the captured secure ownership, but grant the team NO
# access to them (raw data files are the SQL server's, reached via the client).
declarative_access_ownership:
  - { path: '/var/lib/mysql', owner: 'mysql', group: 'mysql', mode: '0755' }
  - { path: '/var/lib/mysql-files', owner: 'mysql', group: 'mysql', mode: '0750' }
  - { path: '/var/lib/mysql-keyring', owner: 'mysql', group: 'mysql', mode: '0700' }
# NO declarative_access_files_modify: mysqld's unit files are vendor-owned.
