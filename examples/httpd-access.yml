---
# Reviewed declarative-access profile for Apache httpd (EL9/EL10).
# Generated by `treadmark footprint --app httpd --access-vars`, then tightened at
# review — see docs/applications/httpd.md for the raw-vs-reviewed walkthrough.
# Apply with:
#   ansible-playbook -i inventory playbooks/5_apply_access_profile.yml \
#     -e @examples/httpd-access.yml -e "group_name=<hostname>-app_restricted"
#
# Access model (see docs/declarative-systemd-access.md#file-access-pam_group-and-acls):
#   * pam_group puts the team into the apache group (read/traverse baseline).
#   * CONTENT is group-owned + setgid, so the team writes it via that group and
#     new files inherit the group automatically (least ongoing upkeep).
#   * CONFIG write is an ACL — it grants the TEAM, without also letting the
#     apache service account rewrite its own config.
#   * LOGS are 0700 root, so read access is an ACL too.
declarative_access_profile_name: 'httpd'
declarative_access_sudo: true
declarative_access_services:
  - 'httpd'
  # 'htcacheclean' was in the raw profile (ships with httpd) — add it back only
  # if the site uses mod_cache_disk.
declarative_access_pam_group: true
declarative_access_local_groups:
  - 'apache'
declarative_access_ownership:
  # Web content: group-owned + setgid so apache-group members write it and new
  # files inherit the group. Verified: team can edit content, new files land in
  # the apache group.
  - { path: '/var/www', owner: 'root', group: 'apache', mode: '2775', recurse: true }
  # Enforce the captured state-dir ownership (no team access — apache only).
  - { path: '/var/lib/httpd', owner: 'apache', group: 'apache', mode: '0700' }
declarative_access_folders_modify:
  - '/etc/httpd'      # config drop-ins — ACL write (root-owned package config)
declarative_access_folders_read:
  - '/var/log/httpd'  # 0700 root — ACL read
# NO declarative_access_files_modify: httpd's unit files are vendor-owned.
