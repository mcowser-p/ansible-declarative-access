---
# Reviewed declarative-access profile for nginx (EL9/EL10).
# Generated by `cairn footprint --app nginx --access-vars`, then tightened at
# review — see docs/applications/nginx.md. Apply with:
#   ansible-playbook -i inventory playbooks/5_apply_access_profile.yml \
#     -e @examples/nginx-access.yml -e "group_name=<hostname>-app_restricted"
#
# Access model (same shape as httpd — see docs/declarative-systemd-access.md):
# pam_group(nginx) for the baseline, setgid content for group-owned writes,
# ACL for config write + log read.
declarative_access_profile_name: 'nginx'
declarative_access_sudo: true
declarative_access_services:
  - 'nginx'
  # 'logrotate' (the SYSTEM log-rotation service+timer) was pulled in as a
  # dependency and dropped — it is not nginx's to administer.
declarative_access_pam_group: true
declarative_access_local_groups:
  - 'nginx'
declarative_access_ownership:
  # Default web root, group-owned + setgid for team writes. (Add /var/www here
  # too if the site serves from there.)
  - { path: '/usr/share/nginx/html', owner: 'root', group: 'nginx', mode: '2775', recurse: true }
  - { path: '/var/lib/nginx', owner: 'nginx', group: 'root', mode: '0770' }
declarative_access_folders_modify:
  - '/etc/nginx'      # config incl. conf.d drop-ins — ACL write
declarative_access_folders_read:
  - '/var/log/nginx'  # ACL read
# NO declarative_access_files_modify: nginx's unit files are vendor-owned.
