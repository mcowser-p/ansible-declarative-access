---
# Reviewed declarative-access profile for PostgreSQL (EL9 default 13; EL10 16).
# Generated by `cairn footprint --app postgresql --access-vars`, then tightened
# at review — see docs/applications/postgresql.md. Apply with:
#   ansible-playbook -i inventory playbooks/5_apply_access_profile.yml \
#     -e @examples/postgresql-access.yml -e "group_name=<hostname>-app_restricted"
#
# Access model: CONFIG-SCOPED by default. PostgreSQL keeps its config INSIDE the
# 0700 data dir, and the postgres group owns the raw cluster, so pam_group would
# over-grant. This profile grants ACL write on just the two config files
# (postgresql.conf, pg_hba.conf) and read on the log subdir; DB admin is via the
# client (sudo -u postgres psql). The role sets traverse ACLs on the parent data
# dir automatically, so raw data files stay unreadable.
#
# NOTE: these config files exist only AFTER `postgresql-setup --initdb` (run in
# the setup window). Group option: add the team to the postgres group with
# -e enable_pam_group=true -e '{"declarative_access_local_groups":["postgres"]}'.
declarative_access_profile_name: 'postgresql'
declarative_access_sudo: true
declarative_access_services:
  - 'postgresql'
declarative_access_files_modify:
  - '/var/lib/pgsql/data/postgresql.conf'   # server settings — ACL write
  - '/var/lib/pgsql/data/pg_hba.conf'       # client auth (security-critical)
declarative_access_folders_read:
  - '/var/lib/pgsql/data/log'               # database logs — ACL read
# Enforce the captured data-dir ownership (no team access to the cluster files).
declarative_access_ownership:
  - { path: '/var/lib/pgsql', owner: 'postgres', group: 'postgres', mode: '0700' }
# NO declarative_access_files_modify beyond config: unit files are vendor-owned.
