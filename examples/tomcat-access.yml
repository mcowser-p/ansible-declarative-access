---
# Reviewed declarative-access profile for Apache Tomcat (EL9/EL10).
# Generated by `cairn footprint --app tomcat --access-vars`, then tightened at
# review — see docs/applications/tomcat.md. Apply with:
#   ansible-playbook -i inventory playbooks/5_apply_access_profile.yml \
#     -e @examples/tomcat-access.yml -e "group_name=<hostname>-app_restricted"
#
# Access model: Tomcat is the app where pam_group does the most work with the
# LEAST setup — the package already ships webapps/ as 0775 root:tomcat, so
# adding the team to the tomcat group lets them deploy WARs with NO ownership
# change or ACL needed. Config write + log read are ACLs.
declarative_access_profile_name: 'tomcat'
declarative_access_sudo: true
declarative_access_services:
  - 'tomcat'
declarative_access_pam_group: true
declarative_access_local_groups:
  - 'tomcat'
# NO setgid needed for deploys: /var/lib/tomcat/webapps is already 0775
# root:tomcat, so tomcat-group members can drop WARs there directly. We only
# enforce the captured ownership (the raw profile's JDK dirs /etc/java,
# /etc/jvm, /etc/.java, /etc/pki/nssdb and /var/lib/tomcats were DROPPED — they
# are shared runtime, not this Tomcat's).
declarative_access_ownership:
  - { path: '/etc/tomcat', owner: 'root', group: 'tomcat', mode: '0755' }
  - { path: '/var/lib/tomcat', owner: 'root', group: 'tomcat', mode: '0755' }
declarative_access_folders_modify:
  - '/etc/tomcat'      # server.xml, tomcat.conf — ACL write
declarative_access_folders_read:
  - '/var/log/tomcat'  # tomcat:root 0770 — group is root, so ACL read
# NO declarative_access_files_modify: Tomcat's unit files are vendor-owned.
